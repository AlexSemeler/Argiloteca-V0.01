{% macro chat_icon(name) -%}
<svg class="argilo-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{% if name == 'plus' %}<path d="M12 5v14M5 12h14"/>
{% elif name == 'history' %}<path d="M3 11a9 9 0 1 1 3 8M3 5v6h6M12 7v5l3 2"/>
{% elif name == 'send' %}<path d="M12 20V4M6 10l6-6 6 6"/>
{% elif name == 'close' %}<path d="m6 6 12 12M18 6 6 18"/>
{% elif name == 'copy' %}<rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V3H3v13h5"/>
{% elif name == 'download' %}<path d="M12 3v12M7 10l5 5 5-5M4 16v5h16v-5"/>
{% else %}<path d="M4 12h16m-6-6 6 6-6 6"/>{% endif %}
</svg>
{%- endmacro %}
