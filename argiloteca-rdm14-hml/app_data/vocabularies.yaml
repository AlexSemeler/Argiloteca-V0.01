  data-file: vocabularies/grupo_mineralogico.jsonl
argilominerais:
  pid-type: argm
  data-file: vocabularies/argilominerais.jsonl
tempo_geologico:
  pid-type: tgeo
  data-file: vocabularies/tempo_geologico.jsonl
