[project]
name = "argiloteca-rdm-14-homologacao-instance"
description = "Add your description here"
readme = "README.md"
version = "14.0.4"
requires-python = "~= 3.14.0"

dependencies = [
  "invenio-app-rdm[opensearch2]==14.0.4",
  "uwsgi>=2.0",
  "uwsgitop>=0.11",
  "uwsgi-tools>=1.1.1",
  "lxml-html-clean>=0.1.1",
  "argiloteca-rdm14-hml",
  "argiloteca",
]

[tool.uv.sources]
"argiloteca-rdm14-hml" = { workspace = true }
"argiloteca" = { workspace = true }

[tool.uv.workspace]
members = ["site", "argiloteca_custom"]

[project.optional-dependencies]
tests = [
  "pytest-invenio>=4.0.0,<5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
